packages:
  - base/*
  - apps/*

saveExact: true

# Supply-chain settings. Sietch exists because of attacks like Shai-Hulud, so we apply the same care to our own dependencies.

# Only install versions published at least 1 day ago. Most malicious releases are caught and removed within hours.
# Setting it explicitly also turns on strict mode: pnpm fails rather than silently picking a newer version.
minimumReleaseAge: 1440

# Fail if a package's publishing trust drops compared with earlier versions (for example, it used to be published
# with trusted publishing or provenance and suddenly isn't). That pattern is typical of a hijacked maintainer account.
trustPolicy: no-downgrade

# Fail the install when any dependency wants to run an install script that nobody has reviewed.
strictDepBuilds: true

# Dependencies allowed (true) or refused (false) to run install scripts. Every entry needs a comment explaining why.
allowBuilds: {}
